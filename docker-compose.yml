services:
  lotus-hr:
    build: .
    container_name: lotus-hr-dashboard
    restart: unless-stopped
    ports:
      - "16310:16310"
    environment:
      - NODE_ENV=production
      - PORT=16310
      - HOSTNAME=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - COOKIE_SECURE=false
    volumes:
      - lotus-hr-data:/app/data
    # Database: /app/data/db.json | Backups: /app/data/backups/ (auto every 24h)

volumes:
  lotus-hr-data:
